<h2>Lista de Usuarios</h2>
<div class="user-list">
  <mat-card *ngFor="let user of users" class="user-card">
    <mat-card-header>
      <mat-card-title>{{ user.name }}</mat-card-title>
      <mat-card-subtitle>{{ user.email }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p><strong>Username:</strong> {{ user.username }}</p>
    </mat-card-content>
  </mat-card>
</div>
